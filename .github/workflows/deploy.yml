# Workflow for building and deploying a Gatsby site to GitHub Pages
name: Deploy Gatsby site to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 설치/실행 스텝이 동일한 캐시 경로를 쓰도록 강제 (경로 불일치로 인한 "Could not find Chrome" 방지)
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
          else
            echo "Unable to determine package manager" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore Gatsby cache
        uses: actions/cache@v4
        with:
          path: |
            public
            .cache
          key: ${{ runner.os }}-gatsby-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gatsby-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Clean Gatsby cache
        run: npm run clean

      - name: Build with Gatsby
        env:
          PREFIX_PATHS: 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} run build

      - name: Install Chrome for Puppeteer
        run: |
          set -euo pipefail
          # npm ci의 postinstall이 폴더만 만들고 바이너리는 미완료로 남기는 경우가 있어,
          # 깨진 캐시를 비우고 깨끗하게 재설치한다.
          rm -rf "$PUPPETEER_CACHE_DIR"
          npx puppeteer browsers install chrome
          CHROME_PATH=$(find "$PUPPETEER_CACHE_DIR/chrome" -type f -name chrome | head -1)
          echo "Installed Chrome at: $CHROME_PATH"
          test -x "$CHROME_PATH"

      - name: Capture playground thumbnails
        run: |
          npx gatsby serve --prefix-paths &
          npx wait-on http://localhost:9000/ --timeout 30000
          node scripts/capture-thumbnails.mjs http://localhost:9000 --out-dir public/playground
          kill %1 || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
